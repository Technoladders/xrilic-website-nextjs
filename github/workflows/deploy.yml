name: Deploy Next.js Website

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Tagging it differently to distinguish from the app
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/xrilic-nextjs-website:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Pull the new image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/xrilic-nextjs-website:latest

            # 2. Stop/Remove the OLD website container (if running)
            # We use the '|| true' flag so script doesn't fail if container doesn't exist yet
            docker stop xrilic-nextjs-website || true
            docker rm xrilic-nextjs-website || true

            # 3. Run the NEW Container
            # Notice we connect it to 'zivelogin-network-prod' immediately
            docker run -d \
              --name xrilic-nextjs-website \
              --restart unless-stopped \
              --network zivelogin-network-prod \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/xrilic-nextjs-website:latest

            # 4. Cleanup Disk Space
            docker image prune -f