name: Deploy Next.js Website

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Directly jump to Docker Build
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/xrilic-nextjs-website:latest
          # ✅ ADDED: Pass secrets as build arguments
          build-args: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/xrilic-nextjs-website:latest
            docker stop xrilic-nextjs-website || true
            docker rm xrilic-nextjs-website || true
            
            # Pass env vars again for Runtime (Container execution)
            docker run -d \
              --name xrilic-nextjs-website \
              --restart unless-stopped \
              --network zivelogin-network-prod \
              -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/xrilic-nextjs-website:latest

            docker image prune -f